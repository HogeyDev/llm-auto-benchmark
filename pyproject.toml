[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-bench"
version = "0.1.0"
description = "Automated Evaluation Harness and GitHub Pages PR Submission System for Small Local AI"
authors = [
    { name = "Sean Dolan", email = "148463374+SeanDolan0@users.noreply.github.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "pygithub>=2.1.0",
    "psutil>=5.9.0",
    "textual>=0.40.0",
]

[project.optional-dependencies]
transformers = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "bitsandbytes>=0.43.0",
]
llamacpp = [
    "llama-cpp-python>=0.2.70",
]
vllm = [
    "vllm>=0.4.0",
]
test = [
    "pytest>=7.0.0",
]
all = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "bitsandbytes>=0.43.0",
    "llama-cpp-python>=0.2.70",
    "pytest>=7.0.0",
]

[project.scripts]
slm-bench = "slm_bench.cli:main"

[tool.setuptools.packages.find]
include = ["slm_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
