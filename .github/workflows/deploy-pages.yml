name: Deploy Static Leaderboard to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Locate Site Directory
        id: site_locator
        run: |
          if [ -d "website" ]; then
            echo "site_dir=website" >> $GITHUB_OUTPUT
          else
            echo "site_dir=Website" >> $GITHUB_OUTPUT
          fi

      - name: Aggregate Benchmark Results
        run: |
          python ${{ steps.site_locator.outputs.site_dir }}/scripts/aggregate.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site_locator.outputs.site_dir }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
